  jpy_per_usd: 157.0
  auto: true

# 事業計画マスター（数値の正本）。計画値・カテゴリ基準・リスク閾値・ステージゲート・タスクをここから読む
# sheet_id は公開リポジトリに載せないよう config.local.yaml に書く（plan: sheet_id: "..."）
plan:
  sheet_id: null
  start_month: "2026-09"   # 計画の1か月目
  refresh_hours: 6

# 1件あたりの費用（計画シート「ユニットエコノミクス」と同じ構成）
costs:
  packing_material_jpy: 500   # 梱包資材
  labor_jpy: 1500             # 検品・撮影・出品・発送の作業費
  reserve_rate: 0.016         # 返品・値下げ・為替の引当（売価比）
  # 米国向けはDDP必須（eBay・2025-10-17〜）。関税はセラー負担。
  # 関税率: 2026-07-24以降、日本からの輸入は通商法301条で「MFN＋301条の合計が原則12.5%」（合算方式）と報道 → 12.5%
  #   品目で違う場合はジャンルごとに us_duty_rate を設定。CBP/USTR の公式発表で要確認（外部環境ページ）
  us_buyer_share: 0.5
  us_duty_rate: 0.125

fees:
  mercari:
    buyer_fee_jpy: 0
    buyer_fee_rate: 0.0
  ebay:
    # eBay Final Value Fee（カテゴリ平均。ジャンル別に final_value_fee_rate で上書き可）
    final_value_fee_rate: 0.1325
    payment_fixed_fee_usd: 0.30
    # 日本登録セラーの海外手数料（eBay日本語FAQ）
    international_fee_rate: 0.0135
    # Promoted Listings 等（売価比）
    ad_rate: 0.02
    # Payoneer / Wise の USD→JPY 換金スプレッド
    payout_fx_spread_rate: 0.02

# 候補に載せる基準
thresholds:
  max_buy_jpy: 150000    # 仕入れ価格の上限（資金に応じて。0で無制限）
  min_sold_count: 3      # 需要の下限: eBayでその検索語が直近に売れた件数（0001_sedori）
  min_price_ratio: 0.20  # 付属品・別物よけ: 相場(円)の2割未満の出品は本体ではないとみなす
  min_profit_jpy: 8000   # 貢献利益の下限（カテゴリ別の下限が計画シートにあればそちらを優先）
  min_roi: 0.30          # 仕入ROI = 貢献利益 ÷ 仕入価格
  match_threshold: 0.55  # Mercari品 ↔ eBay成約品の一致スコア（0〜1）
  min_comps: 2           # 相場算出に必要なマッチ件数

# 除外語は3階層でマージ: 全体（exclude_keywords）＋ カテゴリ（category_excludes）＋ ジャンル（genres[].exclude_keywords）
# 全ジャンル共通（0001_sedori のリサーチで誤検知が多かった語を、良品を消さない範囲で採用）
exclude_keywords: ["ジャンク", "部品取り", "動作未確認", "難あり", "空箱", "箱のみ", "互換機", "攻略本", "カタログ", "パンフレット", "ポスター", "ステッカー", "キーホルダー"]
# カテゴリ別。「〜のみ」で付属品単体を除き、セット品（前後キャップ付き・箱説付き）は残す
category_excludes:
  "カメラ・交換レンズ": ["キャップのみ", "フードのみ", "ケースのみ", "ストラップのみ", "説明書のみ", "取扱説明書のみ", "データバック", "マウントアダプター", "レンズフィルターのみ"]
  "ゲーム・限定品": ["ソフトのみ", "説明書のみ", "コントローラーのみ", "ケーブルのみ", "アダプターのみ", "クラシックミニ", "液晶のみ", "シェル", "交換用"]
  "音響・楽器・電子機器": ["箱のみ", "取扱説明書のみ", "電源アダプターのみ", "ノブのみ"]
  "その他型番商品": ["ベルトのみ", "バンドのみ", "コマのみ", "箱のみ"]

# eBay公式API（キーは config.local.yaml の ebay_api: {client_id: "...", client_secret: "..."} に書く）
#   ebay_category_ids（各ジャンル）は eBay US のカテゴリID:
#   3323=カメラレンズ / 15230=フィルムカメラ / 31388=デジタルカメラ / 139971=ゲーム機本体 / 181222=ギターエフェクター（親カテゴリ） / 15052=ポータブルオーディオ / 31387=腕時計 / 139973=ゲームソフト。Browse APIは1回に1カテゴリなので、複数書くとカテゴリごとに呼んで合算
ebay_api:
  marketplace: EBAY_US
  use_browse: true           # 出品中の件数・価格（競合の数）
  use_insights: true         # 売れた商品（承認制。未承認なら手動取り込みの相場を使う）
  active_as_market: false    # 売れた相場がないジャンルで、出品中の価格×0.85を暫定相場にするか

# 通知（Slack）。webhook URL は config.local.yaml に書く:  notify: {slack_webhook_url: "https://hooks.slack.com/services/..."}
notify:
  on_new_candidates: true   # 基準を満たした新着
  on_master_hits: true      # マスター（継続仕入れ）のヒット
  max_per_scan: 10
