# 外部環境（メルカリ・eBay・物流/関税・為替・需要・競合）
# ツールの「外部環境」ページに表示されます。GitHub上で編集できます。
#   level   : 追い風 / 逆風 / 要注意 / 要確認
#   checked : 最後に事実を確認した日。review_by を過ぎたら再確認を促します
#   tool    : ツールの計算・運用でどう扱っているか（前提値はここと config.yaml を一致させる）
last_reviewed: "2026-10-16"

# 外部環境から導いた、戦略への示唆（ダッシュボード・戦略ページの判断材料）
implications:
  - "相場データの確保が最優先。eBayの成約データはログイン必須になった。ツール用ブラウザでのログインと、Product Research・公式APIの併用で「相場が取れない日」をなくす。"
  - "米国向けはDDPで関税がセラー負担になった。計画シートのユニットエコノミクスには関税と換金スプレッドが入っておらず、貢献利益を1件3〜4千円ほど過大に見ている可能性がある（売価62,000円の基準ケースで18,000円→約14,000円）。"
  - "メルカリ自身が海外の買い手へ直接売るようになり、アニメ・ゲームは仕入れの取り合いになっている。計画どおりゲームは20%に抑え、カメラ・レンズ（追い風）と楽器など型番が明確な商品で利益を作る。"
  - "米国の関税率が流動的なうちは、英国・豪州・欧州など米国以外への販売比率を上げると利益が安定する。出品時の配送ポリシー・価格で米国以外の買い手を取りに行く。"
  - "円安（157〜158円）は追い風だが、1円の円高で売価62,000円あたり約400円の利益が減る。為替は自動取得し、引当1.6%で吸収できる範囲かを毎月確認する。"
  - "自社の実データ（2026-06のゲーム機265件）でも、全費用込みでゲーム・限定品の下限利益8,000円に届く候補は0件だった。ゲームは量を回すほど作業が増えるだけで、利益にはならない。"
  - "メルカリの規約（事業者利用・自動取得）は事業継続のリスク。タスクP03を最優先で確認し、取得は低頻度・購入は人の手で行う運用を守る。"

areas:
  - key: sell
    name: 販売先（eBay）
    items:
      - title: 売れた商品（Sold）の閲覧にログインが必須に
        level: 逆風
        fact: >-
          2026-07-22から、eBayの売れた商品・終了した出品の検索はサインインが必要になったと報じられている
          （eBay公式の告知は未確認）。ログインしていないアクセスには403やCAPTCHAが返る。
          ツールでも同じ現象を確認した（2026-10-02）。
        impact: 相場データの取得が仕入れ判断の前提なので、取れないと候補がゼロになる。業界全体で相場を取りにくくなり、データを持つセラーが有利になる。
        tool: ツール専用ブラウザでeBayにログインして取得し、成約データを12時間キャッシュしてアクセスを抑える。今後はSeller Hubの「Product Research（旧Terapeak）」と公式APIで補完する。
        checked: "2026-10-16"
        review_by: "2027-01-15"
        sources:
          - {title: "OpenWeb Ninja: eBay sold/completed listings (2026-07)", url: "https://www.openwebninja.com/blog/how-to-get-ebay-sold-and-completed-listings"}
          - {title: "Frooition: Terapeak / Product Research (2026-05)", url: "https://www.frooition.com/terapeak/"}
      - title: 米国向けはDDP（関税をセラー側で処理）が必須
        level: 逆風
        fact: >-
          2025-10-17以降の取引から、日本→米国（商品価格2,500ドル未満）はDDP必須（eBay日本）。
          DDUで関税を理由に未着ケースが開かれると「Seller fault」となりDefectが付き、削除できない。
          DDPではFVFが関税を含む総額にかかる。関税を別請求するのは禁止。
        impact: 米国で売れるたびに関税分だけ利益が減る。関税を売価に乗せれば価格競争力が落ちる。米国以外（英国・豪州・欧州・アジア）への販売比率が利益に効くようになった。
        tool: 利益計算に「米国関税見込み＝売価×米国の買い手比率(50%)×関税率」を追加（costs.us_buyer_share / us_duty_rate）。発送では関税の実額を入力して実績を補正する。
        checked: "2026-10-16"
        review_by: "2026-12-31"
        sources:
          - {title: "eBay日本: DDP必須化のご案内", url: "https://wwwcojp.ebay.com/ddp-info"}
          - {title: "eBay日本: 米国関税への対応", url: "https://wwwcojp2.ebay.com/tariffs"}
      - title: 手数料体系（FVF＋1件固定＋海外手数料）
        level: 要注意
        fact: >-
          落札手数料（FVF）は多くのカテゴリで13.25〜13.6%＋1件あたり0.30〜0.40ドル（カテゴリ・時期で異なる）。
          日本登録セラーには海外手数料1.35%（eBay日本FAQ）。広告（Promoted Listings）は任意で、別途かかる。
        impact: 合計で売価の約15〜17%。計画シートの「eBay・決済・国際関連手数料 15%」とほぼ一致する。ただし換金スプレッド（約2%）は計画シートに入っていない。
        tool: FVF 13.25%＋0.30ドル＋海外手数料1.35%＋広告2%＋換金スプレッド2%で計算。カテゴリ別のFVFはジャンル設定で上書きできる。
        checked: "2026-10-16"
        review_by: "2027-01-15"
        sources:
          - {title: "eBay日本: よくある質問（手数料）", url: "https://ebay.co.jp/faq/fee/managed-payments-fees-draft/"}
          - {title: "eBay手数料ガイド（2026年版・第三者）", url: "https://exponential-ebay-tool.com/blog/getting-started/ebay-fees-guide/"}
      - title: 需要トレンド（eBay日本 越境ECレポート）
        level: 追い風
        fact: >-
          2026年Q1：トレーディングカードが成長率1位、時計・パーツが3年半ぶりにTOP3（スイス原産品の関税緩和と円安が背景）。
          2026年Q2：鑑定済みの漫画、ONE PIECEカードが急成長。2025年Q1：デジタルカメラが前年比1.5倍で、中古が8割。
          2025年：米国の制度変更を受けて、英国・豪州・欧州・アジアへの販路拡大が進んだ。
        impact: カメラ（計画の45%）は追い風が続いている。トレカと時計が成長の中心だが、真贋・価格変動・資金負担が大きく、計画では保留・後回しにしている。
        tool: ジャンル設定は計画シート「当たりジャンル商品DB」のS/Aを中心に構成。トレカはカード番号での照合ロジックが必要なため未対応（改善候補）。
        checked: "2026-10-16"
        review_by: "2026-11-30"
        sources:
          - {title: "eBay日本: 2026年第1四半期 越境ECレポート", url: "https://www.ebay.co.jp/release/20260520/"}
          - {title: "2026年Q2 越境EC販売動向（CommercePick）", url: "https://www.commercepick.com/archives/101718"}
          - {title: "2025年間 越境ECレポート（ECのミカタ）", url: "https://ecnomikata.com/ecnews/cross-borderec/49835/"}
      - title: 競合（eBay Japan Awards 2025 受賞の法人セラー）
        level: 要注意
        fact: >-
          カメラはカメラのキタムラ、ビデオゲームはモトヤ、トレカはコレクト、楽器はSEVEN、中古ブランドはDilettoなど、店舗網を持つ法人が各カテゴリで強い。
        impact: 仕入れ量や在庫の厚みでは勝てない。個人の差別化は「型番×状態の照合精度」「新着を取る速度」「検品の質」になる。
        tool: 照合精度（P0）と新着の上位表示に注力。受賞ストアの売れ筋型番は、計画シート「競合ベンチマーク」の「次に深掘りする項目」で調べる。
        checked: "2026-10-16"
        review_by: "2027-03-31"
        sources:
          - {title: "eBay Japan Awards 2025", url: "https://www.ebay.co.jp/release/20260312/"}

  - key: logistics
    name: 物流・関税
    items:
      - title: 米国の関税率は流動的（IEEPA関税の失効→代替関税）
        level: 要確認
        fact: >-
          2026-02-20に米最高裁がIEEPAに基づく相互関税（日本15%）を違法と判断し、失効した。代わりに通商法122条に基づく一律10%が課されたが、
          その期限は2026-07-24。期限後の扱い（301条などによる代替措置）は、このページの確認時点では未確認。品目ごとの通常関税（MFN）も別にかかる。
        impact: 関税率によって米国向けの利益が5〜10%前後動く。計画シートのユニットエコノミクスには関税が入っていない。
        tool: 関税率は10%で仮置き（保守的）。確認でき次第 config.yaml の costs.us_duty_rate を更新する。品目で違う場合はジャンルごとに us_duty_rate を設定する。
        checked: "2026-10-16"
        review_by: "2026-10-31"
        sources:
          - {title: "JETRO: 米国関税措置への対応", url: "https://www.jetro.go.jp/world/us_tariff/"}
          - {title: "NRI: トランプ代替関税が失効へ（2026-07）", url: "https://www.nri.com/jp/media/column/kiuchi/20260723.html"}
          - {title: "時事: 相互関税、24日に停止（2026-02）", url: "https://www.jiji.com/jc/article?k=2026022300444&g=int"}
      - title: 日本郵便の米国宛てがDDP条件付きで再開
        level: 追い風
        fact: >-
          2025-08-27から一部停止していた米国宛て郵便物を、2026-04-14から指定郵便局で再開した（DDP・認定事業者のアプリで関税を事前払い）。
          2026-07-24からは事前払いの対象が商品価格800ドルまで→2,500ドルまでに拡大した。
        impact: 小型・軽量のレンズや電子機器は、郵便ルートで送料を下げられる可能性がある。ただし指定局への持ち込みと事前払いの手間がかかる。
        tool: ジャンルごとの国際送料は概算。発送時に送料と関税の実額を入力すると、予測と実績の差（予測利益誤差）に反映される。
        checked: "2026-10-16"
        review_by: "2026-12-31"
        sources:
          - {title: "日本郵便: 米国宛て郵便物の引受再開（続報2）", url: "https://www.post.japanpost.jp/service/send/oversea/information/2026/0714_01.html"}
          - {title: "日本郵便 プレスリリース（2026-04-13）", url: "https://www.post.japanpost.jp/notification/pressrelease/2026/00_honsha/0413_01_01.pdf"}

  - key: source
    name: 仕入れ先（メルカリ）
    items:
      - title: メルカリが海外の買い手へ直接販売（グローバルアプリ）
        level: 逆風
        fact: >-
          海外の買い手が日本のメルカリ出品を直接買える「メルカリ グローバルアプリ」を展開している（香港から開始し、米国などへ拡大する計画）。
          越境取引のGMVは1,122億円（2026年6月期、全体の約9%）で、4年で約19倍。取引の56.9%はアニメ・ゲームなどのポップカルチャー。
        impact: 仕入れ先そのものが販売チャネルになり、海外の買い手と仕入れを取り合う構図になる。特にアニメ・ゲームは価格差が縮みやすい。
        tool: 計画どおり、ゲーム・限定品は20%に抑え、カメラ・楽器などの型番商品を中心にする。ゲームの下限利益は計画シートの8,000円を適用。
        checked: "2026-10-16"
        review_by: "2027-01-15"
        sources:
          - {title: "メルカリ: 越境取引事業の新戦略（グローバルアプリ）", url: "https://prtimes.jp/main/html/rd/p/000000474.000026386.html"}
          - {title: "メルカリ ポップカルチャー越境トレンドレポート2026", url: "https://about.mercari.com/press/news/articles/20260807_xb_acgereport/"}
          - {title: "越境EC、4年で19倍（nippon.com）", url: "https://www.nippon.com/ja/news/kd1482659941506367888/"}
      - title: 転売対策の強化と事業者の利用ルール
        level: 要確認
        fact: >-
          2025-10-09に取引の基本原則を改定し、悪質な転売や価格の乱高下には特例で出品禁止にできる方針を示した。
          事業者による個人向けサービスの利用を制限し、メルカリShopsへの移行を求める規約改定があったとの報道もある（一次情報は未確認）。
        impact: 事業として仕入れるアカウントの扱いや自動取得の可否は、事業継続に関わる。計画シートのタスクP03（メルカリ規約の適合性確認）が未着手。
        tool: 取得は低頻度（15分おき・1ジャンル1ページ）にして、購入は必ず人が行う（自動購入はしない）。規約を確認したら、このページに結論を記録する。
        checked: "2026-10-16"
        review_by: "2026-10-31"
        sources:
          - {title: "さきがけ: メルカリ、悪質な転売抑止 取引の原則改定", url: "https://www.sakigake.jp/news/article/20251009CO0076/"}
          - {title: "メルカリ 利用規約（公式）", url: "https://static.jp.mercari.com/tos"}

  - key: own
    name: 自社の検証データ（0001_sedori リサーチ）
    items:
      - title: レトロゲーム機は、全費用込みだと計画の下限利益に届かない
        level: 逆風
        fact: >-
          2026-06-20に実データ（メルカリ×eBay Sold）でゲーム機14機種を調べ、候補265件を抽出した（送料0円の粗評価で利益中央値は約5千〜1万円）。
          2026-10-16に同じ265件を、今の費用構成（国際送料3,000円・関税・広告・換金・引当・梱包・作業費）で計算し直すと、
          貢献利益の中央値は機種別に−2,400〜+4,000円で、計画の「ゲーム・限定品」下限8,000円に届いたものは0件だった。
          加えて、空箱・ソフト・他機種のコントローラー・クラシックミニなどの別物が多く混ざっていた。
        impact: 計画（意思決定ログ）の「ゲーム単独ではなく高単価の型番商品へ」を、実データが裏付けている。ゲーム機本体は数量を回しても利益にならない。
        tool: 監視ジャンルをカメラ・レンズ中心に再構成済み。ゲームは限定品（アストロボーイ等）と3DS LLなど単価の高いものに絞った。照合では空箱・ソフト・別機種を除外できるようにした。
        checked: "2026-10-16"
        review_by: "2027-01-15"
        sources:
          - {title: "0001_sedori out/candidates_game_20260620_121244.csv（ローカル）", url: ""}
      - title: カメラ本体の需要は厚い（Nikon F3 は成約60件）
        level: 追い風
        fact: >-
          2026-06のeBay Sold実データで、Nikon F3ボディは中央値$360・直近の成約60件（検索1ページの上限）、Sega Saturnは$137・60件だった。
          事前の想定値（フィクスチャ）と実際の相場は大きく違った。
        impact: カメラ本体は単価・需要ともに計画のカメラ・レンズの基準（貢献利益18,000〜23,000円）を狙える。想定値ではなく実データで判断する必要がある。
        tool: Nikon F3・OLYMPUS OM-1 を監視ジャンルに追加した。需要の下限（成約3件以上）を候補の条件にした。
        checked: "2026-10-16"
        review_by: "2027-01-15"
        sources:
          - {title: "0001_sedori 設計仕様.md §4（ローカル）", url: ""}
      - title: eBayの取得方法（トップページ先読み）は6月は有効、10月は無効
        level: 逆風
        fact: >-
          2026-06には「eBayのトップページを先に開いてからSold検索を開く」と、ログインなしで取得できた（0001_sedoriで検証）。
          2026-10-16に同じ方法を試すと、新しいブラウザでは403、ツール用のプロファイルではボット確認ページに飛ばされた。
          7月のログイン必須化の報道と時期が合う。
        impact: eBayの相場取得は「ログイン済みのツール用ブラウザ」か「公式の方法（Product Research・API）」に限られる。
        tool: ダッシュボードの「eBayにログインする」でログインする。成約データは12時間キャッシュ。価格が円表示（日本のIP）でもドルに換算して読む。
        checked: "2026-10-16"
        review_by: "2026-12-31"
        sources:
          - {title: "0001_sedori channels/ebay_playwright.py（ローカル）", url: ""}
      - title: メルカリは内部検索APIで高速に取れる（ただし非公式）
        level: 要確認
        fact: >-
          メルカリの内部検索API（DPoP署名）で、ブラウザなしで1回120件を約1秒で取得でき、商品状態・出品日時・送料負担・ショップ出品かどうかも取れる（0001_sedoriで実装・検証）。
          公開されたAPIではなく、規約や仕様変更のリスクがある。
        impact: 取得が速くなり、商品状態での絞り込みもできるが、メルカリの規約に照らして使ってよいかの判断が要る（タスクP03）。
        tool: "実装済みだが既定はオフ（config.yaml の app.mercari_source を browser にしている）。使う場合は api に変える。失敗したら自動でブラウザ取得に切り替わる。"
        checked: "2026-10-16"
        review_by: "2026-10-31"
        sources:
          - {title: "0001_sedori sources/mercari.py（ローカル）", url: ""}

  - key: macro
    name: 為替・マクロ
    items:
      - title: 円安が継続（157〜158円/ドル）
        level: 追い風
        fact: >-
          2026年10月上旬のドル円は157円台後半〜158円台。米国の利上げ観測と日米金利差による円安圧力が続いている（OANDA）。
        impact: 輸出の円建て利益が増える。1円円高になると、売価62,000円の商品で約400円利益が減る。急な円高への反転がリスク。
        tool: 為替は自動で取得（open.er-api.com、6時間キャッシュ）。返品・値下げ・為替の引当として売価の1.6%を見込む。
        checked: "2026-10-16"
        review_by: "2026-11-15"
        sources:
          - {title: "OANDA: ドル円見通し（2026-10-06）", url: "https://www.oanda.jp/lab-education/?p=129785"}
